<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1f2b">
<title>Para ti, T-rex</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌻%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;1,400;1,600&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('js');</script>
<style>
  :root {
    --night: #0b1f2b;
    --deep: #12303f;
    --teal: #1d4b5f;
    --sun: #ffcb2e;
    --sun-light: #ffe27a;
    --cream: #fff4d6;
    --base: 3.8s;              /* momento en que empieza a aparecer el texto */
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100svh;
    color: var(--cream);
    font-family: var(--serif);
    background:
      radial-gradient(ellipse at 30% 35%, var(--teal) 0%, var(--deep) 45%, var(--night) 100%);
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  main {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    min-height: 100svh;
    max-width: 1180px;
    margin: 0 auto;
    padding: 20px 24px 56px;
    display: grid;
    grid-template-columns: 1fr;
    align-content: center;
    justify-items: center;
    gap: 8px;
  }

  /* ---------- Ramo ---------- */
  .stage { position: relative; display: grid; place-items: center; }
  .stage::before {
    content: "";
    position: absolute;
    inset: -10% -20%;
    background: radial-gradient(closest-side at 50% 40%, rgba(255, 203, 46, .28), rgba(255, 203, 46, 0) 70%);
    animation: breathe 6s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes breathe { from { opacity: .55; transform: scale(.94); } to { opacity: 1; transform: scale(1.05); } }

  #bouquet {
    position: relative;
    display: block;
    height: min(56vh, 620px);
    height: min(56svh, 620px);
    width: auto;
    max-width: 100%;
    overflow: visible;
    filter: drop-shadow(0 24px 30px rgba(0, 0, 0, .35));
  }

  #sway, #pulse { transform-box: view-box; transform-origin: 300px 560px; }
  #sway { animation: sway 7s ease-in-out 4.5s infinite alternate; }
  @keyframes sway { from { transform: rotate(-1.4deg); } to { transform: rotate(1.4deg); } }

  .stem {
    fill: none;
    stroke-linecap: round;
    stroke-dasharray: 1 1;
    stroke-dashoffset: 1;
    animation: grow 1.4s cubic-bezier(.3, .6, .3, 1) var(--d) forwards;
  }
  @keyframes grow { to { stroke-dashoffset: 0; } }

  .bloom {
    transform-box: fill-box;
    transform-origin: center;
    animation: bloom 1.3s cubic-bezier(.2, 1.3, .4, 1) var(--d) both;
  }
  @keyframes bloom { from { transform: scale(0) rotate(-50deg); } to { transform: scale(1) rotate(0); } }

  .nod {
    transform-box: fill-box;
    transform-origin: center;
    animation: nod 5s ease-in-out calc(var(--d) + 1.6s) infinite alternate;
  }
  @keyframes nod { from { transform: rotate(-3.5deg); } to { transform: rotate(3.5deg); } }

  .leaf {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: leaf .9s cubic-bezier(.2, 1.2, .4, 1) var(--d) both;
  }
  @keyframes leaf { from { transform: scale(0); } to { transform: scale(1); } }

  .paper { animation: rise .9s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }

  .bow {
    transform-box: fill-box;
    transform-origin: center;
    animation: bloom 1s cubic-bezier(.2, 1.4, .4, 1) 3.4s both;
  }

  /* ---------- Mensaje ---------- */
  .message {
    position: relative;
    max-width: 34ch;
    text-align: center;
  }
  .message p { margin: 0; }
  .thanks {
    font-size: clamp(1.15rem, 0.9rem + 1.1vw, 1.6rem);
    line-height: 1.6;
    font-weight: 400;
  }
  .signature {
    margin-top: 1.1rem !important;
    font-size: clamp(1.9rem, 1.2rem + 3vw, 3rem);
    line-height: 1.1;
    font-style: italic;
    font-weight: 600;
    color: var(--sun);
  }

  .w { display: inline-block; }
  .js .w {
    opacity: 0;
    animation: word .9s ease forwards;
    animation-delay: calc(var(--base) + var(--i) * 0.075s);
  }
  @keyframes word { from { opacity: 0; filter: blur(6px); } to { opacity: 1; filter: blur(0); } }

  .rex {
    display: inline-block;
    margin-left: .2em;
    animation: bloom .9s cubic-bezier(.2, 1.5, .4, 1) calc(var(--base) + var(--end) * 0.075s + .4s) both,
               bob 2.4s ease-in-out calc(var(--base) + var(--end) * 0.075s + 1.5s) infinite alternate;
  }
  @keyframes bob { from { transform: translateY(0) rotate(-6deg); } to { transform: translateY(-5px) rotate(6deg); } }

  /* ---------- Ambiente ---------- */
  .ambient {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
    opacity: 0;
    animation: fadein 2.5s ease 3s forwards;
  }
  @keyframes fadein { to { opacity: 1; } }

  .fp {
    position: absolute;
    top: 0;
    left: var(--x);
    width: var(--s);
    height: var(--s);
    animation: fall var(--dur) linear var(--dl) infinite;
  }
  .fp i {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 0 100% 0 100%;
    background: linear-gradient(135deg, var(--sun-light), #f2a900);
    opacity: .85;
    animation: flutter var(--fl) ease-in-out var(--dl) infinite alternate;
  }
  @keyframes fall {
    from { transform: translateY(-8vh); }
    to   { transform: translateY(108vh); }
  }
  @keyframes flutter {
    from { transform: translateX(-26px) rotate(-40deg); }
    to   { transform: translateX(26px) rotate(140deg); }
  }

  .spark {
    position: absolute;
    left: var(--x);
    top: var(--y);
    width: var(--s);
    height: var(--s);
    border-radius: 50%;
    background: radial-gradient(circle, #fff6c9 0%, rgba(255, 226, 122, .6) 45%, rgba(255, 226, 122, 0) 70%);
    animation: twinkle var(--dur) ease-in-out var(--dl) infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(.4); }
    50% { opacity: 1; transform: scale(1.4); }
  }

  .hint {
    position: fixed;
    left: 0; right: 0;
    bottom: max(14px, env(safe-area-inset-bottom));
    z-index: 3;
    margin: 0;
    text-align: center;
    font-size: .95rem;
    font-style: italic;
    color: rgba(255, 244, 214, .6);
    pointer-events: none;
    animation: fadein 1.2s ease 9s both;
    transition: opacity .6s;
  }
  .hint.gone { opacity: 0 !important; animation: none; }

  /* ---------- Escritorio ---------- */
  @media (min-width: 900px) {
    main {
      grid-template-columns: 1.05fr 1fr;
      gap: 24px;
      padding-top: 32px;
      padding-bottom: 32px;
    }
    #bouquet { height: min(78vh, 720px); height: min(78svh, 720px); }
    .message { text-align: left; max-width: 32ch; }
  }

  /* ---------- Movimiento reducido ---------- */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .stem { stroke-dashoffset: 0; }
    .js .w { opacity: 1; }
    .ambient, .hint { display: none; }
  }
</style>
</head>
<body>

<div class="ambient" id="ambient" aria-hidden="true"></div>

<main>
  <div class="stage">
    <svg id="bouquet" viewBox="0 0 600 680" role="img" aria-label="Un ramo de flores amarillas envuelto en papel con un lazo"></svg>
  </div>

  <section class="message">
    <p class="thanks" data-split>Gracias por ser como eres, por cuidarme siempre de la mejor manera que puedes y por hacerme reír cada día, incluso esos días en los que estoy de mal humor, triste o enfadado con la vida.</p>
    <p class="signature" data-split data-rex>Te quiero mucho, T-rex.</p>
  </section>
</main>

<p class="hint" id="hint">Toca la pantalla</p>

<script>
(function () {
  "use strict";

  /* ================= 1. El ramo (SVG generado) ================= */
  var svg = document.getElementById("bouquet");
  var BASE = { x: 300, y: 505 };            // punto donde se juntan los tallos

  function petalPath(len, wid, round) {
    if (round) {
      return "M0,0 C" + (-wid) + "," + (-len * 0.15) + " " + (-wid) + "," + (-len) + " 0," + (-len) +
             " C" + wid + "," + (-len) + " " + wid + "," + (-len * 0.15) + " 0,0Z";
    }
    return "M0,0 C" + (-wid) + "," + (-len * 0.3) + " " + (-wid * 0.9) + "," + (-len * 0.85) + " 0," + (-len) +
           " C" + (wid * 0.9) + "," + (-len * 0.85) + " " + wid + "," + (-len * 0.3) + " 0,0Z";
  }

  function ring(count, offset, len, wid, round, fill, stroke) {
    var out = "", d = petalPath(len, wid, round);
    for (var i = 0; i < count; i++) {
      var a = (360 / count) * i + offset;
      out += '<path d="' + d + '" transform="rotate(' + a.toFixed(1) + ')" fill="' + fill +
             '" stroke="' + stroke + '" stroke-width=".8" stroke-linejoin="round"/>';
    }
    return out;
  }

  function sunflower(r) {
    var s = "";
    s += ring(18, 0,   r,        r * 0.2,  false, "url(#pgDeep)",  "rgba(160,92,0,.35)");
    s += ring(18, 10,  r * 0.88, r * 0.19, false, "url(#pgLight)", "rgba(160,92,0,.25)");
    s += '<circle r="' + (r * 0.44) + '" fill="url(#seed)" stroke="#c98a2b" stroke-width="1.5"/>';
    for (var i = 1; i <= 46; i++) {
      var a = i * 137.508 * Math.PI / 180;
      var d = Math.sqrt(i / 46) * r * 0.39;
      s += '<circle cx="' + (Math.cos(a) * d).toFixed(1) + '" cy="' + (Math.sin(a) * d).toFixed(1) +
           '" r="' + (r * 0.02).toFixed(1) + '" fill="#b98232" opacity=".75"/>';
    }
    return s;
  }

  function daisy(r) {
    var s = "";
    s += ring(12, 0,  r,        r * 0.3,  true, "url(#pgLight)", "rgba(190,120,0,.3)");
    s += ring(10, 9,  r * 0.72, r * 0.27, true, "url(#pgMid)",   "rgba(190,120,0,.3)");
    s += ring(8,  20, r * 0.46, r * 0.22, true, "#ffc21a",       "rgba(190,120,0,.3)");
    s += '<circle r="' + (r * 0.16) + '" fill="#f2a900"/>';
    s += '<circle cx="' + (-r * 0.04) + '" cy="' + (-r * 0.05) + '" r="' + (r * 0.06) + '" fill="#ffe27a" opacity=".9"/>';
    return s;
  }

  function stemPath(x, y, r) {
    var y1 = y + r * 0.35;
    var cx = 300 + (x - 300) * 0.15;
    var cy = y1 + (BASE.y - y1) * 0.55;
    return "M" + BASE.x + "," + BASE.y + " Q" + cx.toFixed(1) + "," + cy.toFixed(1) + " " + x + "," + y1.toFixed(1);
  }

  // [x, y, radio, tipo, orden de floración]
  var flowers = [
    [300, 110, 56, "sun",   9],
    [185, 165, 48, "daisy", 7],
    [415, 165, 48, "daisy", 8],
    [245, 235, 50, "sun",   3],
    [355, 235, 50, "sun",   4],
    [110, 270, 42, "sun",   5],
    [490, 270, 42, "sun",   6],
    [200, 330, 44, "daisy", 1],
    [400, 330, 44, "daisy", 2],
    [300, 320, 46, "daisy", 0]
  ];
  var fillers = [[60, 215], [540, 215], [80, 345], [520, 345], [232, 62], [368, 62]];
  // [x, y, rotación, escala]
  var leaves = [
    [182, 474, -85, 1.2], [418, 474, 85, 1.2],
    [232, 492, -60, 1.45], [368, 492, 60, 1.45],
    [270, 498, -30, 1.6], [330, 498, 30, 1.6]
  ];

  var html = "";

  html += '<defs>' +
    '<linearGradient id="pgDeep" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e89a00"/><stop offset="1" stop-color="#ffc824"/></linearGradient>' +
    '<linearGradient id="pgLight" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffc21a"/><stop offset="1" stop-color="#ffe680"/></linearGradient>' +
    '<linearGradient id="pgMid" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f5a800"/><stop offset="1" stop-color="#ffd23f"/></linearGradient>' +
    '<radialGradient id="seed"><stop offset="0" stop-color="#7a4a17"/><stop offset="1" stop-color="#3f2409"/></radialGradient>' +
    '<linearGradient id="paperL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7ecd6"/><stop offset="1" stop-color="#eadbbb"/></linearGradient>' +
    '<linearGradient id="paperR" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ecdcbc"/><stop offset="1" stop-color="#dcc79f"/></linearGradient>' +
    '</defs>';

  html += '<g id="sway"><g id="pulse">';

  // Tallos de relleno
  fillers.forEach(function (f, k) {
    html += '<path class="stem" pathLength="1" d="' + stemPath(f[0], f[1], 10) +
            '" stroke="#5aa668" stroke-width="2.6" style="--d:' + (0.5 + k * 0.15).toFixed(2) + 's"/>';
  });

  // Hojas
  leaves.forEach(function (l, k) {
    html += '<g transform="translate(' + l[0] + ' ' + l[1] + ') rotate(' + l[2] + ') scale(' + l[3] + ')">' +
      '<g class="leaf" style="--d:' + (0.3 + k * 0.12).toFixed(2) + 's">' +
      '<path d="M0,0 C22,-25 24,-65 0,-100 C-24,-65 -22,-25 0,0Z" fill="#4c9a5a"/>' +
      '<path d="M0,0 C22,-25 24,-65 0,-100 L0,0Z" fill="#2f6e42" opacity=".35"/>' +
      '<path d="M0,0 L0,-90" stroke="#2f6e42" stroke-width="1.4" fill="none"/>' +
      '</g></g>';
  });

  // Tallos principales
  flowers.forEach(function (f) {
    html += '<path class="stem" pathLength="1" d="' + stemPath(f[0], f[1], f[2]) +
            '" stroke="#3f8a4f" stroke-width="4.5" style="--d:' + (f[4] * 0.12).toFixed(2) + 's"/>';
  });

  // Florecitas de relleno
  fillers.forEach(function (f, k) {
    var dots = "", i, a;
    for (i = 0; i < 7; i++) {
      a = (Math.PI * 2 / 7) * i;
      dots += '<circle cx="' + (Math.cos(a) * 9).toFixed(1) + '" cy="' + (Math.sin(a) * 9).toFixed(1) +
              '" r="6.5" fill="#ffe27a" stroke="rgba(190,120,0,.3)" stroke-width=".7"/>';
    }
    dots += '<circle r="6" fill="#ffcb2e"/>';
    html += '<g transform="translate(' + f[0] + ' ' + f[1] + ')"><g class="bloom" style="--d:' +
            (2.4 + k * 0.2).toFixed(2) + 's"><g class="nod" style="--d:' + (k * 0.3).toFixed(1) + 's">' +
            dots + '</g></g></g>';
  });

  // Flores
  flowers.forEach(function (f, k) {
    var rot = (f[0] - 300) * 0.06;
    var delay = 1.2 + f[4] * 0.28;
    html += '<g transform="translate(' + f[0] + ' ' + f[1] + ') rotate(' + rot.toFixed(1) + ')">' +
      '<g class="bloom" style="--d:' + delay.toFixed(2) + 's">' +
      '<g class="nod" style="--d:' + ((k % 4) * 0.5).toFixed(1) + 's">' +
      (f[3] === "sun" ? sunflower(f[2]) : daisy(f[2])) +
      '</g></g></g>';
  });

  // Papel de envolver
  html += '<g class="paper">' +
    '<path d="M100,436 Q205,492 300,505 L300,660 Z" fill="url(#paperL)" stroke="#d3bd93" stroke-width="1.2" stroke-linejoin="round"/>' +
    '<path d="M500,436 Q395,492 300,505 L300,660 Z" fill="url(#paperR)" stroke="#c9b389" stroke-width="1.2" stroke-linejoin="round"/>' +
    '<path d="M208,478 L300,650" stroke="#d3bd93" stroke-width="1" opacity=".6" fill="none"/>' +
    '<path d="M392,478 L300,650" stroke="#c0aa80" stroke-width="1" opacity=".6" fill="none"/>' +
    '</g>';

  // Lazo
  var loopL = '<path d="M300,537 C255,498 210,506 222,542 C230,568 276,556 300,537Z" fill="#e4574b"/>' +
              '<path d="M300,537 C262,512 236,520 238,538 C240,552 272,548 300,537Z" fill="#c63f35" opacity=".55"/>';
  var tailL = '<path d="M298,545 Q280,578 258,600 L282,598 Q294,580 306,552Z" fill="#d44a3f"/>';
  html += '<g class="bow">' +
    '<path d="M158,500 Q300,548 442,500 L419,526 Q300,574 181,526 Z" fill="#e4574b"/>' +
    '<path d="M181,526 Q300,574 419,526 L416,531 Q300,580 184,531 Z" fill="#b93a30" opacity=".5"/>' +
    loopL + '<g transform="translate(600 0) scale(-1 1)">' + loopL + '</g>' +
    tailL + '<g transform="translate(600 0) scale(-1 1)">' + tailL + '</g>' +
    '<circle cx="300" cy="540" r="11" fill="#f0695c"/>' +
    '<circle cx="297" cy="537" r="4" fill="#ff9a8f" opacity=".7"/>' +
    '</g>';

  html += '</g></g>';
  svg.innerHTML = html;

  /* ================= 2. Texto palabra a palabra ================= */
  var idx = 0;
  Array.prototype.forEach.call(document.querySelectorAll("[data-split]"), function (p) {
    var text = p.textContent.trim();
    var words = text.split(/\s+/);
    p.setAttribute("aria-label", text);
    p.innerHTML = words.map(function (w) {
      return '<span class="w" aria-hidden="true" style="--i:' + (idx++) + '">' + w + '</span>';
    }).join(" ");
    if (p.hasAttribute("data-rex")) {
      var rex = document.createElement("span");
      rex.className = "rex";
      rex.setAttribute("aria-hidden", "true");
      rex.style.setProperty("--end", idx);
      rex.textContent = "🦖";
      p.appendChild(rex);
    }
    idx += 6; // pequeña pausa entre párrafos
  });

  /* ================= 3. Pétalos que caen y destellos ================= */
  var ambient = document.getElementById("ambient");
  var rnd = function (a, b) { return a + Math.random() * (b - a); };
  var amb = "", i;
  for (i = 0; i < 16; i++) {
    amb += '<div class="fp" style="--x:' + rnd(0, 98).toFixed(1) + '%;--s:' + rnd(10, 19).toFixed(0) +
           'px;--dur:' + rnd(10, 18).toFixed(1) + 's;--dl:-' + rnd(0, 16).toFixed(1) +
           's;--fl:' + rnd(2.2, 4.2).toFixed(1) + 's"><i></i></div>';
  }
  for (i = 0; i < 26; i++) {
    amb += '<div class="spark" style="--x:' + rnd(2, 96).toFixed(1) + '%;--y:' + rnd(3, 94).toFixed(1) +
           '%;--s:' + rnd(8, 20).toFixed(0) + 'px;--dur:' + rnd(2.5, 5.5).toFixed(1) +
           's;--dl:-' + rnd(0, 5).toFixed(1) + 's"></div>';
  }
  ambient.innerHTML = amb;

  /* ================= 4. Toca la pantalla: lluvia de pétalos ================= */
  var hint = document.getElementById("hint");
  var pulse = document.getElementById("pulse");

  document.addEventListener("pointerdown", function (e) {
    hint.classList.add("gone");

    for (var n = 0; n < 14; n++) {
      var el = document.createElement("div");
      var size = rnd(9, 18);
      el.style.cssText = "position:fixed;z-index:5;pointer-events:none;left:" + (e.clientX - size / 2) +
        "px;top:" + (e.clientY - size / 2) + "px;width:" + size + "px;height:" + size +
        "px;border-radius:0 100% 0 100%;background:linear-gradient(135deg,#ffe27a,#f2a900)";
      document.body.appendChild(el);

      var ang = rnd(0, Math.PI * 2), dist = rnd(50, 150);
      var dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist - 40, rot = rnd(-240, 240);
      var anim = el.animate([
        { transform: "translate(0,0) scale(.5) rotate(0deg)", opacity: 1 },
        { transform: "translate(" + dx + "px," + dy + "px) scale(1) rotate(" + rot + "deg)", opacity: 1, offset: 0.55 },
        { transform: "translate(" + dx * 1.15 + "px," + (dy + 110) + "px) scale(.9) rotate(" + rot * 1.5 + "deg)", opacity: 0 }
      ], { duration: rnd(1100, 1700), easing: "cubic-bezier(.2,.7,.4,1)" });
      anim.onfinish = (function (node) { return function () { node.remove(); }; })(el);
    }

    pulse.animate([
      { transform: "scale(1)" },
      { transform: "scale(1.035)", offset: 0.4 },
      { transform: "scale(1)" }
    ], { duration: 600, easing: "ease-out" });
  });
})();
</script>
</body>
</html>
